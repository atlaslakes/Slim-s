<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>indoor1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
<div id="stage" style="width:1920px;height:1080px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:1px;background:#1e293b;transform-origin:center center;">
    <div style="grid-column:1 / span 6;grid-row:1 / span 6;overflow:hidden;background:#0f172a;">
      <img src="assets/ff370630a_IMG_3042.JPG" style="width:100%;height:100%;object-fit:cover;">
    </div></div>
  <script>
    (function () {
      var W = 1920, H = 1080;
      function fit() {
        var s = Math.min(window.innerWidth / W, window.innerHeight / H);
        document.getElementById('stage').style.transform = 'scale(' + s + ')';
      }
      fit();
      window.addEventListener('resize', fit);

      var SLIDE_MS = 3000;
      function rotate(imgs) {
        var i = 0;
        setInterval(function () {
          imgs[i].style.opacity = '0';
          i = (i + 1) % imgs.length;
          imgs[i].style.opacity = '1';
        }, SLIDE_MS);
      }
      document.querySelectorAll('.slide').forEach(function (box) {
        var imgs = box.querySelectorAll('img');
        if (imgs.length > 1) rotate(imgs);
      });
      var solo = document.querySelectorAll('#stage > .solo');
      if (solo.length > 1) rotate(solo);
    })();
  </script>

  <script>
    const updateCheckUrl = `${window.location.pathname}?t=${Date.now()}`;
    let lastSeenHtml = document.documentElement.outerHTML;

    async function checkForUpdates() {
      try {
        const response = await fetch(updateCheckUrl, { cache: 'no-store' });
        if (!response.ok) return;
        const latestHtml = await response.text();
        if (latestHtml && latestHtml !== lastSeenHtml) {
          window.location.reload();
          return;
        }
        lastSeenHtml = latestHtml || lastSeenHtml;
      } catch (error) {
        console.debug('Update check failed', error);
      }
    }

    function maybeCheckForUpdates() {
      if (document.visibilityState === 'visible') checkForUpdates();
    }
    document.addEventListener('visibilitychange', maybeCheckForUpdates);
    window.addEventListener('focus', maybeCheckForUpdates);
    setInterval(maybeCheckForUpdates, 60000);
    maybeCheckForUpdates();
  </script>
</body>
</html>
