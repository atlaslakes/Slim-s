<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Extras</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    #slide {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 1;
      transition: opacity 0.8s ease-in-out;
    }

    #slide.fade {
      opacity: 0;
    }
  </style>
</head>
<body>
  <img id="slide" src="" alt="" />

  <script>
    let lastSeenHtml = null;

    async function checkForUpdates() {
      try {
        const url = `${window.location.pathname}?t=${Date.now()}`;
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) return;

        const latestHtml = await response.text();
        if (!latestHtml) return;

        // First successful fetch just establishes the baseline.
        if (lastSeenHtml === null) {
          lastSeenHtml = latestHtml;
          return;
        }

        if (latestHtml !== lastSeenHtml) {
          window.location.reload();
        }
      } catch (error) {
        console.debug('Update check failed', error);
      }
    }

    function maybeCheckForUpdates() {
      if (document.visibilityState === 'visible') {
        checkForUpdates();
      }
    }

    document.addEventListener('visibilitychange', maybeCheckForUpdates);
    window.addEventListener('focus', maybeCheckForUpdates);
    setInterval(maybeCheckForUpdates, 60000);
    maybeCheckForUpdates();
  </script>

  <script>
    const images = [
      "boockets.png",
      "season_shakes.jpg"
    ];

    const INTERVAL_MS = 30000;
    const FADE_MS = 800;

    (function run() {
      if (!images.length) return;

      const el = document.getElementById('slide');
      let index = 0;

      // Preload so swaps are instant.
      images.forEach(name => { new Image().src = 'assets/' + name; });

      function show(i) {
        el.classList.add('fade');
        setTimeout(() => {
          el.src = 'assets/' + images[i];
          el.classList.remove('fade');
        }, FADE_MS);
      }

      el.src = 'assets/' + images[0];

      if (images.length > 1) {
        setInterval(() => {
          index = (index + 1) % images.length;
          show(index);
        }, INTERVAL_MS);
      }
    })();
  </script>
</body>
</html>
